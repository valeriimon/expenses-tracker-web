<ion-tabs (ionTabsDidChange)="selected.set($event.tab)">
  <ion-tab-bar slot="bottom">
    @for (item of tabs; track item.tab) {
      <ion-tab-button [tab]="item.tab" [href]="'/tabs/' + item.tab">
        <ion-icon
          aria-hidden="true"
          [name]="selected() === item.tab ? item.icon : item.icon + '-outline'"
        ></ion-icon>
        <ion-label>{{ item.label }}</ion-label>
      </ion-tab-button>
    }
  </ion-tab-bar>
</ion-tabs>
